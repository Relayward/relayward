services:
  relayward:
    image: ghcr.io/relayward/relayward:${RELAYWARD_VERSION:-latest}
    pull_policy: always
    command:
      - serve
      - -listen
      - 0.0.0.0:8080
      - -data
      - /var/lib/relayward
      - -web
      - /usr/share/relayward/web
      - -event-hot-retention
      - ${RELAYWARD_EVENT_HOT_RETENTION:-24h}
      - -event-archive-retention
      - ${RELAYWARD_EVENT_ARCHIVE_RETENTION:-2160h}
    ports:
      - ${RELAYWARD_BIND_ADDRESS:-127.0.0.1}:${RELAYWARD_PORT:-8080}:8080
    volumes:
      - relayward-data:/var/lib/relayward
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      options:
        max-size: 10m
        max-file: "3"

volumes:
  relayward-data:
