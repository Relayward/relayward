services:
  relayward:
    image: ghcr.io/relayward/relayward:${RELAYWARD_VERSION:-latest}
    container_name: relayward
    ports:
      - "${RELAYWARD_BIND_ADDRESS:-127.0.0.1}:${RELAYWARD_PORT:-8080}:8080"
    volumes:
      - ./.data:/var/lib/relayward
    restart: unless-stopped

  # 可选 HTTPS 方案：在 Cloudflare 中将 Tunnel 源站配置为
  # http://relayward:8080，在 .env 中填写 CLOUDFLARE_TUNNEL_TOKEN，
  # 然后取消此服务的整段注释。
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: relayward-cloudflared
  #   command:
  #     - tunnel
  #     - run
  #   environment:
  #     TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
  #   restart: unless-stopped
