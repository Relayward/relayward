name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".env.example"
      - ".gitignore"
      - "compose.yaml"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".env.example"
      - ".gitignore"
      - "compose.yaml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/relayward ./cmd/relayward

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/relayward/relayward:dev
          build-args: VERSION=dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          data_dir="$(mktemp -d)"
          trap 'docker rm -fv relayward-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name relayward-ci --read-only --tmpfs /tmp:size=64m \
            --mount "type=bind,source=$data_dir,target=/var/lib/relayward" \
            ghcr.io/relayward/relayward:dev
          healthy=false
          for attempt in $(seq 1 30); do
            if docker exec relayward-ci relayward healthcheck; then
              healthy=true
              break
            fi
            echo "waiting for Relayward healthcheck ($attempt/30)"
            sleep 1
          done
          if [ "$healthy" != true ]; then
            docker logs relayward-ci
            exit 1
          fi
          docker exec relayward-ci sh -c \
            'grep -q "^Uid:[[:space:]]*10001[[:space:]]" /proc/1/status'
          test "$(stat -c %u "$data_dir")" = "10001"
          docker exec --user 10001 relayward-ci test -f /var/lib/relayward/relayward.db
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push development image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/relayward/relayward:dev
