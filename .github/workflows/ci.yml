name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/relayward ./cmd/relayward

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: relayward:ci
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          trap 'docker rm -fv relayward-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name relayward-ci --read-only --tmpfs /tmp:size=64m relayward:ci
          for attempt in $(seq 1 30); do
            if docker exec relayward-ci relayward healthcheck; then
              exit 0
            fi
            echo "waiting for Relayward healthcheck ($attempt/30)"
            sleep 1
          done
          docker logs relayward-ci
          exit 1
