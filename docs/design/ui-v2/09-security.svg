    <rect x="276" y="160" width="1124" height="112" rx="7" fill="#FFFFFF" stroke="#DDE3E6" /><rect x="296" y="180" width="44" height="44" rx="8" fill="#EAF2F8" /><g transform="translate(307 191) scale(0.9166666666666666)" fill="none" stroke="#356F9F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></g><text x="360" y="193" font-size="13" fill="#17231E" font-weight="650" text-anchor="start" >账户保护状态</text><text x="360" y="216" font-size="11" fill="#69767D" font-weight="400" text-anchor="start" >二次验证已启用，秘密存储可用</text><rect x="1234" y="185" width="82" height="24" rx="12" fill="#E9F5EF" /><text x="1275" y="201" font-size="11" fill="#0D6843" font-weight="600" text-anchor="middle" >保护良好</text><text x="360" y="244" font-size="10" fill="#98A3A8" font-weight="400" text-anchor="start" >上次登录：2026-08-04 13:58 · 当前会话将在 8 月 5 日 13:58 过期</text><rect x="276" y="294" width="1124" height="238" rx="7" fill="#FFFFFF" stroke="#DDE3E6" /><text x="296" y="326" font-size="15" fill="#17231E" font-weight="650" text-anchor="start" >双重验证（TOTP）</text><rect x="1268" y="309" width="70" height="24" rx="12" fill="#E9F5EF" /><text x="1303" y="325" font-size="11" fill="#0D6843" font-weight="600" text-anchor="middle" >已启用</text><text x="296" y="354" font-size="11" fill="#69767D" font-weight="400" text-anchor="start" >登录时需要密码和身份验证器生成的一次性验证码。</text><line x1="296" y1="378" x2="1380" y2="378" stroke="#E9EDF0" stroke-width="1"/><circle cx="316" cy="416" r="16" fill="#EAF2F8"/><g transform="translate(308 408) scale(0.6666666666666666)" fill="none" stroke="#356F9F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></g><text x="346" y="414" font-size="12" fill="#17231E" font-weight="650" text-anchor="start" >身份验证器</text><text x="346" y="434" font-size="10" fill="#69767D" font-weight="400" text-anchor="start" >配置于 2026-07-28</text><circle cx="316" cy="474" r="16" fill="#EAF2F8"/><g transform="translate(308 466) scale(0.6666666666666666)" fill="none" stroke="#356F9F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M15 7l2 2M18 4l2 2"/></g><text x="346" y="472" font-size="12" fill="#17231E" font-weight="650" text-anchor="start" >恢复码</text><text x="346" y="492" font-size="10" fill="#69767D" font-weight="400" text-anchor="start" >剩余 8 个未使用恢复码</text><rect x="1060" y="399" width="148" height="36" rx="6" fill="#FFFFFF" stroke="#DDE3E6" /><g transform="translate(1072 408) scale(0.7083333333333334)" fill="none" stroke="#17231E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6v5h-5M4 18v-5h5M18.4 9A7 7 0 0 0 6 6.6L4 11M5.6 15A7 7 0 0 0 18 17.4l2-4.4"/></g><text x="1141.5" y="422" font-size="13" fill="#17231E" font-weight="600" text-anchor="middle" >重新生成恢复码</text><rect x="1220" y="399" width="160" height="36" rx="6" fill="#FDEDED" stroke="#F2C8C8" /><text x="1300" y="422" font-size="13" fill="#C63D3D" font-weight="600" text-anchor="middle" >停用双重验证</text><rect x="276" y="554" width="1124" height="206" rx="7" fill="#FFFFFF" stroke="#DDE3E6" /><text x="296" y="586" font-size="15" fill="#17231E" font-weight="650" text-anchor="start" >中心秘密存储</text><text x="296" y="614" font-size="11" fill="#69767D" font-weight="400" text-anchor="start" >用于加密插件凭据、通知令牌及其他受保护配置。</text><line x1="296" y1="640" x2="1380" y2="640" stroke="#E9EDF0" stroke-width="1"/><circle cx="306" cy="677" r="4" fill="#16875A"/><text x="316" y="681" font-size="12" fill="#17231E" font-weight="500" text-anchor="start" >主密钥已加载</text><text x="488" y="681" font-size="10" fill="#69767D" font-weight="400" text-anchor="start" >来源</text><text x="536" y="681" font-size="11" fill="#17231E" font-weight="600" text-anchor="start" >环境变量</text><text x="688" y="681" font-size="10" fill="#69767D" font-weight="400" text-anchor="start" >启动时间</text><text x="758" y="681" font-size="11" fill="#17231E" font-weight="600" text-anchor="start" >2026-08-04 13:55</text><text x="1030" y="681" font-size="10" fill="#69767D" font-weight="400" text-anchor="start" >状态</text><rect x="1082" y="664" width="68" height="24" rx="12" fill="#E9F5EF" /><text x="1116" y="680" font-size="11" fill="#0D6843" font-weight="600" text-anchor="middle" >可读写</text><text x="296" y="723" font-size="10" fill="#98A3A8" font-weight="400" text-anchor="start" >密钥不可从管理端查看或导出。更换密钥需要按运维流程离线执行。</text><rect x="276" y="782" width="1124" height="76" rx="7" fill="#FFF4E4" /><circle cx="304" cy="820" r="13" fill="#F6D8AE"/><text x="304" y="824" font-size="12" fill="#B76A12" font-weight="700" text-anchor="middle" >!</text><text x="334" y="814" font-size="11" fill="#B76A12" font-weight="650" text-anchor="start" >敏感操作会结束当前会话</text><text x="334" y="833" font-size="9" fill="#69767D" font-weight="400" text-anchor="start" >停用 TOTP 或变更管理员凭据后，需要重新登录。</text>
